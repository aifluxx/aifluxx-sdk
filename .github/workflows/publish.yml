# Publish to PyPI with trusted publishing (OIDC). No API token.
# Does not run on branch pushes or pull requests.
# A tag matching v* publishes. Do not create a v* tag to test this workflow.
#
# Before the first run, add this workflow as a PyPI trusted publisher:
#   owner: aifluxx
#   repository: aifluxx-sdk
#   workflow: publish.yml
#   environment: pypi
# The GitHub environment name must match. Create the `pypi` environment
# in the repository settings if it does not exist yet.

name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/aifluxx-sdk
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          bare = tag[1:] if tag.startswith("v") else tag
          if bare != version:
              raise SystemExit(f"tag {tag} does not match pyproject version {version}")
          print(f"version {version}")
          PY
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
