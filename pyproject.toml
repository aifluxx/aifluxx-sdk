[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aifluxx-sdk"
version = "0.1.0"
description = "Python client and aifluxx CLI for agent packages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "pyyaml>=6,<7",
]

[project.scripts]
aifluxx = "aifluxx_sdk.cli:main"
truest = "aifluxx_sdk.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]
a2a = ["a2a-sdk>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
