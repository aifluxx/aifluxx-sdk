[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aifluxx-sdk"
version = "0.1.0"
description = "Python client and aifluxx CLI for the AIfluxx developer API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "AIfluxx" }]
keywords = ["aifluxx", "agents", "sdk", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://aifluxx.co.za"
Documentation = "https://github.com/aifluxx/aifluxx-sdk#readme"
Repository = "https://github.com/aifluxx/aifluxx-sdk"
Issues = "https://github.com/aifluxx/aifluxx-sdk/issues"
Changelog = "https://github.com/aifluxx/aifluxx-sdk/releases"

[project.scripts]
aifluxx = "aifluxx_sdk.cli:main"
# Deprecated console script. Prints a warning, then runs the aifluxx CLI.
truest = "aifluxx_sdk.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "build>=1.2", "twine>=6"]
a2a = ["a2a-sdk>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aifluxx_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
